<style>
:root{
  --ink:#1f2d3a; --ink2:#5b6b7a; --line:#e8e2d6;
  --teal:#0f766e; --teal-l:#ccfbf1; --orange:#ea7c1f; --orange-l:#ffedd5;
  --violet:#6d5bd0; --violet-l:#ece9ff; --rose:#d9446b; --rose-l:#ffe4ec;
  --green:#15803d; --green-l:#dcfce7; --red:#b91c1c; --red-l:#fee2e2;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:#faf7f0;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(247,165,74,.16), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(15,118,110,.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(109,91,208,.10), transparent 45%);
  min-height:100vh;padding:26px 14px 64px;
}
.wrap{max-width:820px;margin:0 auto}
.hero{
  background:linear-gradient(135deg,#0f766e 0%,#12877d 55%,#0e9f8e 100%);
  border-radius:22px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 14px 36px rgba(15,118,110,.28);margin-bottom:18px;
}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.24),transparent 65%)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.5px;
  background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px;margin-bottom:10px}
.hero h1{margin:0;font-size:27px;line-height:1.3;font-weight:700}
.hero p{margin:8px 0 0;font-size:13.5px;opacity:.9;line-height:1.6}
.grid{display:grid;gap:14px}
.card{background:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 8px 26px rgba(90,110,130,.10);
  border:1px solid #f1ece1;animation:rise .45s ease both}
.card h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.card h3 .chev{margin-left:auto;color:#b9c6cf;font-size:13px;transition:transform .2s}
.card.collapsed h3 .chev{transform:rotate(-90deg)}
.card.collapsed .card-body{display:none}
.card-body{margin-top:12px}
.badge{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex:none}
.b1{background:var(--teal)} .b2{background:var(--orange)} .b3{background:var(--violet)} .b4{background:var(--rose)}
p.para{margin:8px 0;line-height:1.85;font-size:15px;color:var(--ink)}
/* 并列编号列表 */
ol.num{margin:8px 0;padding-left:0;list-style:none;counter-reset:n}
ol.num li{position:relative;padding-left:34px;margin:10px 0;line-height:1.75;font-size:15px;counter-increment:n}
ol.num li:before{content:counter(n);position:absolute;left:0;top:1px;width:23px;height:23px;border-radius:50%;
  background:var(--teal-l);color:var(--teal);font-size:12px;font-weight:700;
  display:flex;align-items:center;justify-content:center}
/* 流程 */
.flow{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;margin-top:4px}
.step{flex:1;min-width:130px;background:linear-gradient(180deg,#ffffff,#f6fbfa);
  border:1px solid #d9ede9;border-radius:14px;padding:12px}
.step .n{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.4px}
.step .t{font-size:14.5px;margin-top:4px;line-height:1.55}
.arrow{color:#b9cdc9;font-size:18px;font-weight:700;align-self:center}
/* 要点 */
ul.kv{margin:8px 0 0;padding-left:0;list-style:none}
ul.kv li{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-size:15px;line-height:1.7}
ul.kv li .dotc{width:8px;height:8px;border-radius:50%;flex:none;margin-top:8px;background:var(--orange)}
/* 题目 */
.qtitle{font-weight:600;font-size:15px;margin:14px 0 6px;line-height:1.6;display:flex;gap:8px;align-items:flex-start}
.qtitle .qn{flex:none;width:22px;height:22px;border-radius:50%;background:#2f5d62;color:#fff;font-size:12px;

.qtitle .qtext{flex:1}
.qtitle .tts,.qtitle .cpq{flex:none;border:none;background:#eef4f3;color:#3d6b66;border-radius:8px;width:26px;height:26px;

.qtitle .tts:hover,.qtitle .cpq:hover{background:#dcebe8}

.scorebar .ok{color:#7ee2b8;font-weight:700}
.scorebar .bad{color:#ff9d9d;font-weight:700}

.scorebar .sb-btn.ghost{background:#eaf6f4;color:#1c2b2a}
.scorebar .sb-btn.ghost:hover{background:#d7eeea}
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:8px 0;padding:12px 14px;
  border-radius:12px;border:1.5px solid #e6e0d4;background:#fffdf8;font-size:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:.16s}
.opt .k{width:26px;height:26px;border-radius:8px;background:#f3efe6;color:#8a7a5f;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.opt:hover{border-color:var(--orange);background:#fff8ee}
.opt.on{border-color:var(--teal);background:var(--teal-l);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.opt.on .k{background:var(--teal);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-l);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l);box-shadow:0 0 0 3px rgba(185,28,28,.10)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt .mark{margin-left:auto;font-size:14px;font-weight:700}
.ansline{margin:6px 0 0;font-size:13px;color:var(--green);display:none}
.ansline.show{display:block}
.hintline{margin:6px 0 0;font-size:12.5px;color:#9aa7b2;display:none}
.hintline.show{display:block}
.note{margin:0 0 12px;padding:9px 12px;border-radius:10px;background:#fff7e6;color:#8a6d3b;font-size:12.5px;line-height:1.6;border:1px solid #f5e0b7}
.refans{margin:8px 0 0;border:1px dashed #cfdbe3;border-radius:10px;background:#fbfdfe;padding:6px 10px}
.refans summary{cursor:pointer;color:var(--teal);font-size:13px;font-weight:600;padding:3px 0;outline:none}
.refans[open] summary{border-bottom:1px dashed #dfe7ec;margin-bottom:6px}
.refbody .refline{margin:6px 0;font-size:13px;line-height:1.75;color:#5b6b7a}
.expline{margin:6px 0 0;font-size:12.5px;line-height:1.7;color:#7b8794;background:#fafbfc;border-left:3px solid #dfe7ea;padding:6px 8px;border-radius:6px;display:none}
.expline.show{display:block}
.expline.noexp{color:#a6b0ba;background:#f7f9fa}
.actions{display:flex;gap:10px;margin-top:18px}
.actions button{flex:1;padding:12px;border-radius:13px;border:none;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:600;transition:.16s}
.act-main{background:linear-gradient(135deg,#0f766e,#0e9f8e);color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.25)}
.act-ghost{background:#fff;color:var(--teal);border:1.5px solid #cfe7e3}
.foot{margin-top:20px;text-align:center;font-size:12px;color:#a9b4bd}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.katex{font-size:1.02em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:6px 2px;margin:10px 0}
.katex-display::-webkit-scrollbar{height:6px}
.katex-display::-webkit-scrollbar-thumb{background:#dbe4e8;border-radius:3px}
@media (max-width:520px){.hero h1{font-size:23px}.flow{flex-direction:column}.arrow{display:none}.katex{font-size:0.98em}}
</style>

<script>
var SB_URL = 'https://stefvsokishbdowhushy.supabase.co';
var SB_KEY = 'sb_publishable_oeWZ9eyPqcBvO28W3wUJFQ_IdWSQBBi';
var COLORS = ['b1','b2','b3','b4'];
var GLYPH = ['①','②','③','④','⑤','⑥','⑦','⑧'];
var VC2_BUILD = '20261118-prose-answer-fix'; // 散文题不再按位置错贴答案

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getParam(n){
  var m = new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : '';
}
function decodePack(d){
  if(!d) return null;
  var s = d.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  try{
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){ return null; }
}

/* ---------- 预处理 ---------- */
function normalize(text){
  var t = String(text || '')
    .replace(/\r/g, '')
    .replace(/＋/g, '+')
    .replace(/#{1,6}\s*/g, '\n')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    // 去掉 Markdown 分隔线（--- 这类），否则会变成奇怪的要点
    .replace(/^\s*(?:-{3,}|\*{3,}|_{3,})\s*$/gm, '')
    // 选项前带列表符号（- A. xxx）时先去掉符号，否则会被当成要点
    .replace(/^\s*[-*•]\s+(?=[A-DＡ-Ｄ][\.、])/gm, '')
    .replace(/^\s*[-*•]\s+/gm, '- ')
    // 只有「→ 答案/正确答案」这种箭头才拆行（lim(x→0) 里的箭头不能拆）
    .replace(/\s*[→➜➤]\s*(?=(?:正确)?答案)/g, '\n')
    // 「正确答案：X」「答案：X」也单独成行
    .replace(/((?:正确)?答案\s*[:：])/g, '\n$1');
  // 把一行里的多个选项拆开：A. xx B. xx C. xx D. xx
  return t.split('\n').map(function(line){
    var s = line.trim();
    if (!s) return '';
    // 题干后紧跟内联选项：在 A. 前断行
    if (!/^[A-DＡ-Ｄ][\.、]/.test(s)) {
      s = s.replace(/\s*([AＡ][\.、])/, '\n$1');
    }
    var marks = s.match(/(^|\s)[A-DＡ-Ｄ][\.、]\s*/g);
    if (marks && marks.length >= 2) {
      var parts = s.split(/(?=(?:^|\s)[A-DＡ-Ｄ][\.、]\s*)/).map(function(x){ return x.trim(); }).filter(Boolean);
      if (parts.length >= 2) return parts.join('\n');
    }
    return s;
  }).join('\n');
}

/* ---------- 解析 ---------- */

// 从文末「答案与解析」区块提取答案 + 解析
function extractAnswers(raw){
  var text = String(raw || '').replace(/\r/g, '');
  var lines = text.split('\n');
  var cut = -1;
  // 答案区标题的严格形态：答案 / 答案解析 / 答案与解析 / 参考答案 / 解析 等
  var HEAD_RE = /^(?:参考|正确)?答\s*案(?:\s*[与和及、]?\s*(?:解析|详解|说明|解答|提示|汇总|速查))?$|^(?:解析|详解)(?:\s*[与和及、]?\s*答案)?$/;
  var candidates = [];
  for (var i = 0; i < lines.length; i++) {
    var l = lines[i].replace(/#{1,6}\s*/g, '').replace(/\*\*/g, '').trim();
    if (!l) continue;
    // 先把「答案与解析：」这类标题的尾部冒号去掉再判断
    var headCore = l.replace(/[（(【\[].*$/, '').replace(/[）)】\]]+$/, '').replace(/[：:、，,。.]+$/, '').trim();
    // 标题必须是"原本就短"的行；且「解析：正文」这种带内容的行不能当标题
    var isShortTitle = l.length <= 24 && headCore.length <= 12;
    var isExpLine = /^(解析|解答|分析|说明)\s*[:：]\s*\S/.test(l);
    if (isShortTitle && !isExpLine && HEAD_RE.test(headCore)) { candidates.push(i); continue; }
    // 「点击选项即可查看答案：」这类引导句也当作答案区起点
    if (l.length <= 22 && /(答案|解析)/.test(l) && /(查看|如下|清单|见下|揭晓)/.test(l)) { candidates.push(i); continue; }
    // 带冒号的是答案内容，不是小节标题
    if (/[：:]/.test(l)) continue;
    // 「答案：1.B 2.C」这类是答案行，不是小节标题，先排除
    if (/^答案\s*[:：]\s*\d/.test(l)) continue;
    if (/\d\s*[\.、]\s*[A-DＡ-Ｄ]/.test(l)) continue;
  }
  // 按候选顺序逐个试：切出来的块像答案就用它（避免多个「答案：」行把前面的答案切走）
  function mergeAnsLines(s0){
    return s0.replace(/\n(\d+[\.、][^\n]{0,16})\n((?:参考)?答案\s*[:：])/g, '\n$1$2');
  }
  function looksLikeAnswerText(t0){
    return /(?:^|\n)\s*\d+\s*[\.、]?[^\n]{0,16}?答案\s*[:：]/.test(t0)
      || /(?:^|\n)\s*\d+\s*[\.、]\s*[（(]?[A-DＡ-Ｄ]/.test(t0)
      || /(?:^|\n)\s*(?:解析|解答|分析)\s*[:：]/.test(t0)
      || /(?:^|\n)\s*[A-DＡ-Ｄ]\s*[（(。]?\s*[^\n]{0,40}$/.test(t0);
  }
  for (var c = 0; c < candidates.length; c++) {
    var afterN = lines.slice(candidates[c] + 1).filter(function(x){ return x.trim(); }).length;
    if (afterN < 1) continue;
    var blk = mergeAnsLines(lines.slice(candidates[c] + 1).join('\n'));
    if (looksLikeAnswerText(blk)) { cut = candidates[c]; break; }
  }
  if (cut < 0 && candidates.length) cut = candidates[candidates.length - 1];
  // 兜底：没有标题、且正文里完全没有「答案：」时，才按末尾「解析：」切开
  if (cut < 0 && !/答案\s*[:：]/.test(text)) {
    for (var j = Math.floor(lines.length * 0.5); j < lines.length; j++) {
      if (/^(?:解析|解答|分析|详解)\s*[:：]/.test(lines[j].trim())) { cut = j; break; }
    }
  }
  // 校验：切出来的那一块必须真的像答案，否则不切，避免吞掉正文
  if (cut > -1 && !looksLikeAnswerText(mergeAnsLines(lines.slice(cut + 1).join('\n')))) cut = -1;
  var map = {}, main = text, list = [], texts = [];
  var block = '';
  if (cut > -1) {
    main = lines.slice(0, cut).join('\n');
    block = lines.slice(cut + 1).join('\n');
  } else {
    // 没有独立区块时，把「答案：1.B 2.B」这类汇总行也捞出来
    var tail = [];
    var keep = [];
    lines.forEach(function(l){
      // 「答案：1.B 2.B」以及「1. 答案：B」两种都捞
      var isSummary = /^\s*(?:正确)?答案\s*[:：]/.test(l) && /(\d+)\s*[\.、:：\-]?\s*[A-DＡ-Ｄ]/.test(l);
      var isNumbered = /^\s*\d+\s*[\.、]?\s*(?:参考|正确)?答案\s*[:：]/.test(l);
      if (isSummary || isNumbered) tail.push(l);
      else keep.push(l);
    });
    if (tail.length) { block = tail.join('\n'); main = keep.join('\n'); }
  }
  if (!block) return { main: main, map: map, list: list, texts: texts };
  // 把「N. 小标题」紧跟「答案：」的写法合并成「N. 小标题答案：」
  block = block.replace(/\n(\d+[\.、][^\n]{0,16})\n((?:参考)?答案\s*[:：])/g, '\n$1$2');

  // 同一组内同题号重复出现时，以最后一次为准（模型常在末尾再汇总一遍正确答案）
  var subkey = '', slot = {}, pendingText = -1;
  function put(n, letters, expTxt){
    var k = subkey + '#' + n;
    var item = { n: n, ans: letters, exp: expTxt || '' };
    if (slot[k] !== undefined) {
      var old = list[slot[k]];
      list[slot[k]] = item;
      if (!item.exp) item.exp = old.exp || '';
    } else {
      slot[k] = list.length;
      list.push(item);
    }
  }

  block.split('\n').forEach(function(line){
    var s = line
      .replace(/#{1,6}\s*/g, '')
      .replace(/\*\*/g, '')
      .replace(/`/g, '')
      .replace(/^[\s>*\-•]+/, '')
      .trim();
    if (!s) return;
    // 上一条文字答案的续行（简答题的多行要点）
    if (pendingText >= 0 && !/^\d+\s*[\.、]/.test(s) && !/^[A-DＡ-Ｄ][\.、]/.test(s) && !/[：:]$/.test(s)) {
      texts[pendingText].text = (texts[pendingText].text + ' ' + s).trim();
      return;
    }
    // 小标题：短的、不含冒号、不以数字开头 → 切换到新的题号分组
    if (s.length <= 14 && !/[：:]/.test(s) && !/^\d/.test(s) && !/^[A-DＡ-Ｄ][\.、]/.test(s)) {
      subkey = s;
      return;
    }
    // 带标题的答案行：1. 选择题1答案：C（…）；3. 简答题答案：
    var mt2 = s.match(/^(\d+)\s*[\.、]?\s*([^\n]{0,16}?)答案\s*[:：]\s*([\s\S]*)$/);
    if (mt2) {
      var n2 = parseInt(mt2[1], 10);
      var rest = (mt2[3] || '').trim();
      var lm = rest.match(/^([A-DＡ-Ｄ](?:\s*[、,，/]\s*[A-DＡ-Ｄ])*)\s*[（(。\.]?\s*([\s\S]*)$/);
      if (lm) {
        put(n2, (lm[1].toUpperCase().match(/[A-D]/g) || []).join(','), (lm[2] || '').trim());
      } else {
        var mm3 = rest.match(/^([\s\S]*?)[。\.]?\s*(?:解析|解答|分析|说明)\s*[:：]\s*([\s\S]*)$/);
        texts.push({ n: n2, text: (mm3 ? mm3[1] : rest).trim(), exp: (mm3 ? mm3[2] : '').trim() });
        pendingText = texts.length - 1;
      }
      return;
    }

    // 形式一：1. 答案：B / 1. 正确答案：B。解析……
    var m1 = s.match(/^(\d+)\s*[\.、]?\s*[（(]?\s*(?:(?:正确)?答案\s*[:：]?\s*)?([A-DＡ-Ｄ](?:\s*[、,，/]\s*[A-DＡ-Ｄ])*)\s*[)）]?\s*[。\.、:：]?\s*([\s\S]*)$/);
    if (m1) {
      var n = parseInt(m1[1], 10);
      var letters = (m1[2].toUpperCase().match(/[A-D]/g) || []).join(',');
      if (letters) put(n, letters, (m1[3] || '').trim());
      return;
    }
    // 文字型答案：2. 答案：单调递增区间为…（解答题参考答案）
    var mt = s.match(/^(\d+)\s*[\.、]?\s*(?:参考)?答案\s*[:：]\s*([\s\S]+)$/);
    if (mt) {
      var tn = parseInt(mt[1], 10);
      var txt = (mt[2] || "").trim();
      if (tn >= 1 && tn <= 200 && txt) {
        var mm2 = txt.match(/^([\s\S]*?)[。\.]?\s*(?:解析|解答|分析|说明)\s*[:：]\s*([\s\S]*)$/);
        texts.push({ n: tn, text: (mm2 ? mm2[1] : txt).trim(), exp: (mm2 ? mm2[2] : '').trim() });
      }
      return;
    }    // 形式二：同一行里多个 1.B 2.C
    var re = /(\d+)\s*[\.、:：\-]?\s*([A-DＡ-Ｄ])(?:\s*[、,，/]\s*([A-DＡ-Ｄ]))?/g;
    var mm, hit = false;
    while ((mm = re.exec(s)) !== null) {
      var nn = parseInt(mm[1], 10);
      var ls = [mm[2], mm[3]].filter(Boolean).map(function(x){ return x.toUpperCase(); }).join(',');
      if (nn >= 1 && nn <= 100 && ls) {
        put(nn, ls, '');
        hit = true;
      }
    }
    if (!hit) {
      // 只有明确以「解析/解答/分析/说明」开头的续行才并入上一条答案，
      // 其它（小标题、计算题解答、下一节内容）一律忽略，避免串到选择题解析里
      if (/^(解析|解答|分析|说明)\s*[:：]/.test(s) && list.length) {
        list[list.length - 1].exp = ((list[list.length - 1].exp || '') + ' ' + s).trim();
      }
    }
  });
  return { main: main, map: map, list: list, texts: texts };
}

function isHeading(line){
  // 编号条目、要点符号，一律不当标题
  if (/^\d+[\.、]/.test(line)) return null;
  if (/^[-·•]/.test(line)) return null;
  if (/^[A-DＡ-Ｄ][\.、]/.test(line)) return null;
  if (/^【.+】$/.test(line)) return line.replace(/^【|】$/g,'');
  if (/^[一二三四五六七八九十]+、.{1,24}$/.test(line)) return line;
  if (/^第[一二三四五六七八九十]+[章节部分].{0,20}$/.test(line)) return line;
  // 不再把「注意：」这类普通短句升格成卡片标题（否则该行会从正文消失）
  return null;
}

function parse(text){
  var lines = normalize(text).split('\n').map(function(s){return s.trim();}).filter(Boolean);
  var secs = [], cur = null;
  function push(title){
    cur = { title: title, items: [] };
    secs.push(cur);
  }
  lines.forEach(function(line){
    var h = isHeading(line);
    if (h) { push(h); return; }
    if (!cur) push('要点');
    cur.items.push(line);
  });
  secs.forEach(function(s){ s.blocks = buildBlocks(s.items); });
  return secs.filter(function(s){ return s.blocks.length > 0; });
}

function buildBlocks(items){
  var blocks = [], i = 0, autoQ = 0;
  function lastQ(){
    for (var k = blocks.length - 1; k >= 0; k--) if (blocks[k].type === 'question') return blocks[k];
    return null;
  }
  while (i < items.length) {
    var line = items[i];

    // 答案行（支持「答案：B」「正确答案：B」「答案：C、D」）
    var ans = line.match(/^(?:正确)?答案\s*[:：]?\s*([A-DＡ-Ｄ](?:\s*[、,，/]\s*[A-DＡ-Ｄ])*)/);
    if (ans) {
      var letters = (ans[1].toUpperCase().match(/[A-D]/g) || []).join(',');
      var q = lastQ();
      if (q && letters) { q.answer = letters; }
      else { blocks.push({ type: 'para', text: line }); }
      i++; continue;
    }

    // 解析行：贴到上一道选择题
    var expLine = line.match(/^(?:解析|解答|分析|说明)\s*[:：]\s*([\s\S]+)$/);
    if (expLine) {
      var qe = lastQ();
      if (qe) { qe.exp = ((qe.exp ? qe.exp + ' ' : '') + line).trim(); i++; continue; }
    }

    // 编号条目
    var num = line.match(/^(\d+)[\.、]\s*(.+)$/);
    if (num) {
      var body = num[2];
      var qno = parseInt(num[1], 10);
      // 情形一：后面紧跟「答案：/解析：」→ 这是解答题（没有选项），把参考答案收在一起
      var kk = i + 1, refs = [];
      while (kk < items.length && /^(?:参考)?答案\s*[:：]|^(?:解析|解答|分析|说明)\s*[:：]/.test(items[kk])) {
        refs.push(items[kk]);
        kk++;
      }
      // 解析后面可能还有续行（不以数字/选项开头的内容）
      while (refs.length && kk < items.length && !/^\d+[\.、]/.test(items[kk]) && !/^[A-DＡ-Ｄ][\.、]/.test(items[kk])) {
        refs.push(items[kk]);
        kk++;
      }
      if (refs.length) {
        blocks.push({ type: 'shortq', n: qno, text: body, refs: refs });
        i = kk; continue;
      }
      // 情形二：后面紧跟选项 → 选择题
      var j = i + 1, hasOpt = false;
      while (j < items.length && /^[A-DＡ-Ｄ][\.、]\s*/.test(items[j])) { hasOpt = true; break; }
      if (hasOpt) {
        autoQ += 1;
        blocks.push({ type: 'question', n: qno || autoQ, text: body, options: [], answer: null, exp: '' });
        i++; continue;
      }
      blocks.push({ type: 'num', n: qno, text: body });
      i++; continue;
    }

    // 选项（解析/答案行不算选项）
    if (!/^(?:正确)?答案|^解析|^【?(?:答案|解析)】?/.test(line)) {
      var opt = line.match(/^([A-DＡ-Ｄ])[\.、]\s*(.+)$/);
      if (opt) {
        var q2 = lastQ();
        if (!q2) { autoQ += 1; q2 = { type: 'question', n: autoQ, text: '', options: [], answer: null, exp: '' }; blocks.push(q2); }
        q2.options.push({ k: opt[1].toUpperCase(), t: opt[2] });
        i++; continue;
      }
    }

    // 要点符号
    if (/^[-·•]\s*/.test(line)) { blocks.push({ type: 'bullet', text: line.replace(/^[-·•]\s*/,'') }); i++; continue; }

    // Markdown 表格：| 题号 | 题干 | 选项A | … | 答案 |
    if (/^\|/.test(line)) {
      var rows = [];
      while (i < items.length && /^\|/.test(items[i])) { rows.push(items[i]); i++; }
      var header = rows[0] || '';
      if (/题目|题干|选项|答案/.test(header)) {
        rows.slice(1).forEach(function(r){
          if (/^\|[\s\-:|]+\|?\s*$/.test(r)) return;
          var cells = r.split('|').map(function(c){ return c.trim(); });
          if (cells[0] === '') cells.shift();
          if (cells[cells.length - 1] === '') cells.pop();
          if (cells.length < 6) return;
          if (!/^\d+$/.test(cells[0])) return;
          var ansCell = (cells[cells.length - 1] || '').toUpperCase();
          var am = ansCell.match(/[A-D]/);
          blocks.push({
            type: 'question',
            n: parseInt(cells[0], 10),
            text: cells[1],
            options: [
              { k: 'A', t: cells[2] }, { k: 'B', t: cells[3] },
              { k: 'C', t: cells[4] }, { k: 'D', t: cells[5] }
            ],
            answer: am ? am[0] : null,
            exp: ''
          });
        });
      }
      continue;
    }

    // 普通段落（若紧跟选项，视为题干）
    var k2 = i + 1;
    if (k2 < items.length && /^[A-DＡ-Ｄ][\.、]\s*/.test(items[k2])) {
      autoQ += 1;
      blocks.push({ type: 'question', n: autoQ, text: line, options: [], answer: null });
      i++; continue;
    }

    // 去掉模型加的装饰标签：「新题1」「第1题」这类纯标签行
    if (/^(?:新题|第\s*\d+\s*题)\s*\d*$/.test(line)) { i++; continue; }
    // 去掉题干前的「题干：」「题目：」前缀
    line = line.replace(/^(?:题干|题目)\s*[:：]\s*/, '');
    // 散文式题目：题目：xxx / 请解答：xxx / 请问…（无编号）
    var prose = line.match(/^(?:题目|问题|例题|练习)\s*[:：]\s*(.+)$/);
    if (!prose) {
      var looksAsk = /^(?:请|试)?(?:解答|计算|求解|求出|判断|证明|说明|请问|查看|完成)/.test(line) || /[？?]\s*$/.test(line);
      if (looksAsk && line.length >= 10) prose = [line, line];
    }
    if (prose) {
      // 向后扫描：遇到下一条题目/表格就停；从「答案/解析」开始整段收进参考答案（提示部分跳过）
      var refs2 = [];
      var started = false;
      var k3 = i + 1;
      for (; k3 < items.length; k3++) {
        var it = items[k3];
        if (/^(?:题目|问题|例题|练习)\s*[:：]/.test(it) || /^\|/.test(it)) break;
        if (!started && /^(?:参考答案|答案|解答|解析|分析|说明)\s*[:：]/.test(it)) started = true;
        if (started) refs2.push(it);
      }
      autoQ += 1;
      blocks.push({ type: 'shortq', n: autoQ, text: prose[1], refs: refs2, prose: true });
      i = refs2.length ? k3 : i + 1;
      continue;
    }

    blocks.push({ type: 'para', text: line });
    i++;
  }
  // 统一清掉题干前的「题干：」「题目：」前缀
  blocks.forEach(function(b){
    if (b.text) b.text = String(b.text).replace(/^(?:题干|题目)\s*[:：]\s*/, '').trim();
  });
  return blocks;
}

/* ---------- 渲染 ---------- */
function renderSection(sec, idx){
  var color = COLORS[idx % COLORS.length];
  var glyph = GLYPH[idx] || String(idx + 1);
  var body = '';
  var nums = sec.blocks.filter(function(b){ return b.type === 'num'; });
  var flowLike = /步骤|流程|三步|步法|step/i.test(sec.title) && nums.length >= 2;

  if (flowLike) {
    body += '<div class="flow">';
    nums.forEach(function(b, n){
      if (n > 0) body += '<span class="arrow">→</span>';
      body += '<div class="step"><div class="n">STEP ' + (n+1) + '</div><div class="t">' + esc(b.text) + '</div></div>';
    });
    body += '</div>';
  }

  var bulletBuf = [];
  var numBuf = [];
  function flushBullets(){
    if (!bulletBuf.length) return;
    body += '<ul class="kv">' + bulletBuf.map(function(t){ return '<li><span class="dotc"></span><span>' + esc(t) + '</span></li>'; }).join('') + '</ul>';
    bulletBuf = [];
  }
  // 编号按出现位置成组渲染，避免"先渲染所有编号、再渲染题目"导致顺序错乱
  function flushNums(){
    if (!numBuf.length) return;
    if (numBuf.length >= 2) {
      body += '<ol class="num">' + numBuf.map(function(t){ return '<li>' + esc(t) + '</li>'; }).join('') + '</ol>';
    } else {
      body += '<p class="para">' + esc(numBuf[0]) + '</p>';
    }
    numBuf = [];
  }
  function flushAll(){ flushBullets(); flushNums(); }

  sec.blocks.forEach(function(b){
    if (b.type === 'num') {
      if (flowLike) return;           // 已作为流程渲染
      flushBullets();
      numBuf.push(b.text);
      return;
    }
    if (b.type === 'bullet') { flushNums(); bulletBuf.push(b.text); return; }
    flushAll();
    if (b.type === 'shortq') {
      body += '<div class="qblock short">';
      var tools = b.placeholder ? ''
        : '<button class="tts" title="朗读题干" onclick="speak(this)">🔊</button><button class="cpq" title="复制题目" onclick="copyQ(this)">📋</button>';
      body += '<div class="qtitle"><span class="qn">' + b.n + '</span><span class="qtext">' + esc(b.text) + '</span>' + tools + '</div>';
      if (b.refs && b.refs.length) {
        var refHtml = b.refs.map(function(t){
          return '<p class="refline">' + esc(String(t).replace(/^(?:参考)?答案\s*[:：]\s*/, '').replace(/^(?:解析|解答|分析|说明)\s*[:：]\s*/, '')) + '</p>';
        }).join('');
        body += '<details class="refans"><summary>看参考思路（非标准答案，仅供对照）</summary><div class="refbody">' + refHtml + '</div></details>';
      } else {
        body += '<p class="hintline show">本题为解答题，可在对话里让温故批改。</p>';
      }
      body += '</div>';
      return;
    }
    if (b.type === 'para') { body += '<p class="para">' + esc(b.text) + '</p>'; return; }
    if (b.type === 'question') {
      body += '<div class="qblock">';
      if (b.text) body += '<div class="qtitle"><span class="qn">' + b.n + '</span><span class="qtext">' + esc(b.text) + '</span>'
        + '<button class="tts" title="朗读题干" onclick="speak(this)">🔊</button>' + '<button class="cpq" title="复制题目" onclick="copyQ(this)">📋</button></div>';
      if (b.options.length) {
        var gid = 'q' + idx + '_' + b.n;
        body += '<div class="optgroup" data-gid="' + gid + '" data-answer="' + (b.answer || '') + '">';
        b.options.forEach(function(o){
          body += '<button class="opt" data-k="' + o.k + '" onclick="pick(this)"><span class="k">' + o.k + '</span><span>' + esc(o.t) + '</span><span class="mark"></span></button>';
        });
        body += '</div>';
        body += '<p class="ansline">正确答案：' + (b.answer ? b.answer.replace(/,/g,'、') : '') + '</p>';
        if (b.exp) body += '<p class="expline">' + (/^(解析|解答|分析|说明)\s*[:：]/.test(b.exp) ? esc(b.exp) : '解析：' + esc(b.exp)) + '</p>';
        else if (b.answer) body += '<p class="expline noexp">本题暂无解析</p>';
        if (!b.answer) body += '<p class="hintline">本题未附答案，请回到对话让温故批改。</p>';
      }
      body += '</div>';
    }
  });
  flushAll();

  return '<div class="card" data-idx="' + idx + '">'
       +   '<h3 onclick="toggleCard(this)"><span class="badge ' + color + '">' + glyph + '</span>'
       +     esc(String(sec.title).replace(/[（(][^）)]*(点击|展开|查看|折叠)[^）)]*[）)]/g, ''))
       +     '<span class="chev">▾</span></h3>'
       +   '<div class="card-body">' + body + '</div>'
       + '</div>';
}

function render(payload){
  var title = payload.title || '可视化讲解';
  document.getElementById('title').textContent = title;
  document.title = title;
  var raw0 = String(payload.text || '');
  // 跨行的 \[ ... \] 公式块合并成单行 $$...$$，否则会被拆成多段渲染不了
  raw0 = raw0.replace(/\\\[([\s\S]*?)\\\]/g, function(_, body){
    return '$$' + String(body).replace(/\s*\n\s*/g, ' ').trim() + '$$';
  });
  // 先把文末「答案与解析」抽出来
  var extracted = extractAnswers(raw0);
  var raw = extracted.main;
  // 去掉与标题重复的首行（模型常把标题再写一遍）
  var flatTitle = title.replace(/[·・\s]/g, '');
  var secs = parse(raw).map(function(s){
    if (s.title === '要点') {
      s.blocks = s.blocks.filter(function(b){
        var t = (b.text || '').replace(/[·・\s]/g, '');
        return t !== flatTitle && t.length > 0;
      });
      // 只剩一句"标题复读"的，整节丢掉
      if (s.blocks.length === 1) {
        var only = (s.blocks[0].text || '');
        if (only.length <= 40 && /[「」【】]/.test(only)) s.blocks = [];
      }
    }
    return s;
  }).filter(function(s){ return s.blocks.length > 0; });

  // 贴答案：先按「题号数量与题目数量一致」的常规情况做一一对应（防止行内答案+文末答案混用时错位）；
  // 数量对不上时，再退化为「按顺序贴给还没有答案的题」
  var allQ = [];
  secs.forEach(function(s){
    s.blocks.forEach(function(b){ if (b.type === 'question') allQ.push(b); });
  });
  if (extracted.list.length && extracted.list.length === allQ.length) {
    allQ.forEach(function(b, i){
      b.answer = extracted.list[i].ans;
      if (extracted.list[i].exp) b.exp = extracted.list[i].exp;
    });
  } else {
    var cursor = 0;
    allQ.forEach(function(b){
      if (b.answer) return;
      if (cursor < extracted.list.length) {
        var hit = extracted.list[cursor++];
        b.answer = hit.ans;
        if (hit.exp) b.exp = hit.exp;
      }
    });
  }
  // 解答题参考答案：编号题按题号匹配；散文题（无编号 shortq）先挂起，最后只在数量完全相等时按顺序分配
  var tcur = 0;
  var proseQ = [];
  secs.forEach(function(s){
    s.blocks.forEach(function(b){
      if (b.type === 'shortq') {
        if (b.prose) {
          // 散文题没有可靠题号：绝不按位置硬塞，先收集待分配
          if (!b.refs || !b.refs.length) proseQ.push(b);
          return;
        }
        if (tcur < extracted.texts.length && (!b.refs || !b.refs.length)) {
          var tq = extracted.texts[tcur++];
          b.refs = ['参考答案：' + tq.text].concat(tq.exp ? ['解析：' + tq.exp] : []);
        } else if (tcur < extracted.texts.length) {
          tcur++;
        }
        return;
      }
      if (b.type !== 'num') return;
      if (tcur < extracted.texts.length && b.n && extracted.texts[tcur].n === b.n) {
        var tx = extracted.texts[tcur++];
        b.type = 'shortq';
        b.refs = ['参考答案：' + tx.text].concat(tx.exp ? ['解析：' + tx.exp] : []);
      }
    });
  });
  // 第二轮：题号对不上（如全篇连续编号 4、5 而本节从 1 开始）时，按出现顺序补到还没答案的编号题上
  if (tcur < extracted.texts.length) {
    secs.forEach(function(s){
      s.blocks.forEach(function(b){
        if (tcur >= extracted.texts.length) return;
        if (b.type !== 'num') return;
        var tx2 = extracted.texts[tcur++];
        b.type = 'shortq';
        b.refs = ['参考答案：' + tx2.text].concat(tx2.exp ? ['解析：' + tx2.exp] : []);
      });
    });
  }
  // 散文题：只有剩余参考答案数量与待分配散文题数量完全相等时才按顺序贴；
  // 数量对不上时一律不贴，保留「请让温故批改」提示，避免把答案安到别的题上
  var proseLeft = extracted.texts.length - tcur;
  if (proseQ.length && proseLeft === proseQ.length) {
    proseQ.forEach(function(b){
      var tp = extracted.texts[tcur++];
      b.refs = ['参考答案：' + tp.text].concat(tp.exp ? ['解析：' + tp.exp] : []);
    });
  }
  // 还没匹配上的，单独成卡，避免内容丢失
  if (tcur < extracted.texts.length) {
    var extra = extracted.texts.slice(tcur).map(function(t){
      return {
        type: 'shortq',
        n: t.n,
        placeholder: true,
        text: '（该题未编号，题意见上文）',
        refs: ['参考答案：' + t.text].concat(t.exp ? ['解析：' + t.exp] : [])
      };
    });
    secs.push({ title: '参考答案补充', blocks: extra });
  }
  if (!secs.length) {
    document.getElementById('body').innerHTML = '<div class="card"><div class="card-body"><p class="para">没有收到内容。</p></div></div>';
    return;
  }
  // 答案不全时给一句说明，避免用户以为页面坏了
  var missing = 0;
  allQ.forEach(function(b){ if (!b.answer) missing++; });
  var noteHtml = (missing > 0 && allQ.length > 0)
    ? '<p class="note">本次只提供了 ' + (allQ.length - missing) + ' / ' + allQ.length + ' 道题的答案，其余题目请回到对话让温故补全。</p>'
    : '';
  document.getElementById('body').innerHTML = noteHtml + secs.map(renderSection).join('');
  // 公式渲染（KaTeX 可用就用它，否则降级为纯文本）
  setTimeout(function(){ renderMath(document.getElementById('body')); }, 60);
  setTimeout(initScore, 80);
}

/* ---------- 成绩条 ---------- */
var SCORE_START = 0, SCORE_TIMER = null;
function initScore(){
  var groups = document.querySelectorAll('.qblock .optgroup');
  var shortq = document.querySelectorAll('.qblock.short');
  var bar = document.getElementById('scorebar');
  if (!bar) return;
  if (!groups.length && !shortq.length) { bar.style.display = 'none'; document.body.classList.remove('has-score'); return; }
  SCORE_START = Date.now();
  bar.style.display = 'flex';
  document.body.classList.add('has-score');
  updateScore();
  setTimeout(function(){
    var h = bar.offsetHeight || 0;
    if (h > 0) document.body.style.paddingBottom = (h + 18) + 'px';
  }, 60);
  if (SCORE_TIMER) clearInterval(SCORE_TIMER);
  SCORE_TIMER = setInterval(updateScore, 1000);
}
function syncBarPad(bar){
  try {
    var h = bar ? (bar.offsetHeight || 0) : 0;
    if (h > 0) document.body.style.paddingBottom = (h + 18) + 'px';
  } catch (e) {}
}
function updateScore(){
  var bar = document.getElementById('scorebar');
  if (!bar || bar.style.display === 'none') return;
  var groups = document.querySelectorAll('.qblock .optgroup');
  var shortq = document.querySelectorAll('.qblock.short');
  var sec = Math.floor((Date.now() - SCORE_START) / 1000);
  var mm = Math.floor(sec / 60), ss = sec % 60;
  var tm = '<span class="tm">用时 ' + mm + ':' + (ss < 10 ? '0' : '') + ss + '</span>';
  if (!groups.length) {
    bar.innerHTML = '<span>解答 ' + shortq.length + ' 道 · 不计分</span>' + tm + '<button class="sb-btn ghost" onclick="copyMore()">再来几题</button>';
    syncBarPad(bar);
    return;
  }
  var right = 0, wrong = 0;
  Array.prototype.forEach.call(groups, function(g){
    if (g.querySelector('.opt.wrong')) wrong++;
    else if (g.querySelector('.opt.right')) right++;
  });
  var total = groups.length;
  var done = right + wrong;
  var pct = done ? Math.round(right / done * 100) : 0;
  var head = shortq.length
    ? ('选择 ' + total + ' 计分 · 解答 ' + shortq.length + ' 不计分')
    : ('共 ' + total + ' 题');
  var moreBtn = '<button class="sb-btn ghost" onclick="copyMore()">再来几题</button>';
  var wrongBtn = wrong > 0 ? '<button class="sb-btn" onclick="copyWrong()">复制错题</button>' : '';
  bar.innerHTML =
    '<span>' + head + '</span>' +
    '<span class="ok">✓ ' + right + '</span>' +
    '<span class="bad">✗ ' + wrong + '</span>' +
    '<span>' + (done ? '正确率 ' + pct + '%' : '待作答') + '</span>' + tm + wrongBtn + moreBtn;
  syncBarPad(bar);
}

/* ---------- 复制错题（贴回对话让温故出同类新题） ---------- */
function copyWrong(){
  try {
    var items = [];
    var blocks = document.querySelectorAll('.qblock');
    Array.prototype.forEach.call(blocks, function(blk){
      var g = blk.querySelector('.optgroup');
      if (!g) return;
      var wrongOpt = g.querySelector('.opt.wrong');
      if (!wrongOpt) return;
      var qn = blk.querySelector('.qn');
      var qt = blk.querySelector('.qtext');
      var myK = wrongOpt.getAttribute('data-k');
      var ans = g.getAttribute('data-answer') || '';
      items.push('第' + (qn ? qn.textContent.trim() : '') + '题：' + (qt ? qt.textContent.trim() : '') + '（我选了 ' + myK + '，正确答案 ' + ans.replace(/,/g, '、') + '）');
    });
    if (!items.length) return;
    var s = '我做错了这套练习里的几道题，请出 3 道同类型但"换情境"的新题：\n'
      + '硬性要求：\n'
      + '1) 不要出现原题题干，也不要把原题只改数字；\n'
      + '2) 每题必须换一个函数、条件或问法（例如把 x→0 换成 x→1，把等价无穷小换成比较阶）；\n'
      + '3) 每题解析里用一句话说明它和原题的区别；\n'
      + '4) 出好后做成可点击页面。\n\n'
      + '做错的题：\n' + items.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s);
    } else {
      var ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    var btn = document.querySelector('.scorebar .sb-btn');
    if (btn) { var old = btn.textContent; btn.textContent = '已复制 ✅'; setTimeout(function(){ btn.textContent = old; }, 1400); }
  } catch (e) { /* 静默 */ }
}
/* ---------- 再来几题（复制有效话术，贴回对话即可） ---------- */
function copyMore(){
  try {
    var s = '再来 2 道不一样的题，并做成可点击页面，把新链接发给我';
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s);
    } else {
      var ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    var btn = document.querySelector('button[onclick="copyMore()"]');
    if (btn) { var old = btn.textContent; btn.textContent = '已复制 ✅'; setTimeout(function(){ btn.textContent = old; }, 1500); }
  } catch (e) { /* 静默 */ }
}
/* ---------- 朗读 ---------- */
function speak(btn){
  try {
    if (!window.speechSynthesis) return;
    var t = btn.closest('.qtitle') ? btn.closest('.qtitle').querySelector('.qtext') : null;
    var txt = t ? t.textContent : '';
    if (!txt) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = /[\u4e00-\u9fa5]/.test(txt) ? 'zh-CN' : 'en-US';
    u.rate = 1;
    window.speechSynthesis.speak(u);
    btn.textContent = '🔉';
    setTimeout(function(){ btn.textContent = '🔊'; }, 1200);
  } catch (e) { /* 不支持就静默 */ }
}

/* ---------- 复制题目（方便贴到对话里让温故讲） ---------- */
function copyQ(btn){
  try {
    var blk = btn.closest('.qblock');
    if (!blk) return;
    var t = blk.querySelector('.qtext');
    var qn = blk.querySelector('.qn');
    var lines = ['第' + (qn ? qn.textContent.trim() : '') + '题：' + (t ? t.textContent.trim() : '')];
    var opts = blk.querySelectorAll('.optgroup .opt');
    Array.prototype.forEach.call(opts, function(o){
      var k = o.querySelector('.k');
      var spans = o.querySelectorAll('span');
      var txt = spans.length > 1 ? spans[1].textContent : '';
      lines.push((k ? k.textContent.trim() : '') + '. ' + txt.trim());
    });
    var s = lines.join('\n');
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(s);
    } else {
      var ta = document.createElement('textarea');
      ta.value = s; document.body.appendChild(ta); ta.select();
      document.execCommand('copy'); document.body.removeChild(ta);
    }
    btn.textContent = '✅';
    setTimeout(function(){ btn.textContent = '📋'; }, 1200);
  } catch (e) { /* 静默 */ }
}
/* ---------- 交互 ---------- */
function toggleCard(h){
  var card = h.closest('.card');
  if (card) card.classList.toggle('collapsed');
}

function pick(el){
  var group = el.closest('.optgroup');
  var answer = group ? (group.getAttribute('data-answer') || '') : '';
  var opts = group ? group.querySelectorAll('.opt') : [el];
  Array.prototype.forEach.call(opts, function(b){ b.classList.remove('on','right','wrong'); var m = b.querySelector('.mark'); if (m) m.textContent = ''; });

  var scope = (el.closest('.qblock')) || (group && group.parentNode) || document;
  var ansLine = scope.querySelector('.ansline');
  var hintLine = scope.querySelector('.hintline');
  var expLine = scope.querySelector('.expline');

  if (answer) {
    var answers = answer.split(',').map(function(x){ return x.trim(); }).filter(Boolean);
    Array.prototype.forEach.call(opts, function(b){
      var k = b.getAttribute('data-k');
      if (answers.indexOf(k) > -1) { b.classList.add('right'); var m1 = b.querySelector('.mark'); if (m1) m1.textContent = '✓'; }
    });
    if (answers.indexOf(el.getAttribute('data-k')) === -1) {
      el.classList.add('wrong');
      var m2 = el.querySelector('.mark'); if (m2) m2.textContent = '✗';
    }
    if (ansLine) { ansLine.textContent = '正确答案：' + answer.replace(/,/g,'、'); ansLine.classList.add('show'); }
    if (expLine) expLine.classList.add('show');
    if (hintLine) hintLine.classList.remove('show');
  } else {
    el.classList.add('on');
    var mk = el.querySelector('.mark');
    if (mk) mk.textContent = '✓';
    if (hintLine) hintLine.classList.add('show');
  }
  updateScore();
}

async function downloadHtml(){
  // 打个"已冻结"标记：保存下来的文件打开时不再请求数据库
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  if (html.indexOf('name="wg-frozen"') === -1) {
    html = html.replace(/<head([^>]*)>/i, '<head$1><meta name="wg-frozen" content="1">');
  }
  // 把 KaTeX 样式内联进文件，断网时排版也不会塌（字体仍需联网，官方也要求带 fonts 目录）
  try {
    var cssUrl = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';
    var fontBase = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/fonts/';
    var resp = await fetch(cssUrl);
    if (resp.ok) {
      var css = await resp.text();
      css = css.replace(/url\((['"]?)fonts\//g, 'url($1' + fontBase);
      html = html.replace(/<link[^>]*katex[^>]*\.css[^>]*>/i, '<style>' + css + '</style>');
    }
  } catch (e) { /* 内联失败就保持原来的 CDN 引用 */ }
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.title || '温故讲解') + '.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

/* ---------- 数学公式渲染 ---------- */
function latexToText(s){
  var SUP = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','n':'ⁿ','+':'⁺','-':'⁻'};
  var SUB = {'0':'₀','1':'₁','2':'₂','3':'₃','4':'₄','5':'₅','6':'₆','7':'₇','8':'₈','9':'₉','n':'ₙ','x':'ₓ'};
  var t = String(s)
    .replace(/\\\(|\\\)/g, '')
    .replace(/\\\[|\\\]/g, '')
    .replace(/\$\$/g, '')
    .replace(/\$/g, '')
    // 先处理 \frac \sqrt \text 等带花括号的命令，再去掉花括号
    .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)')
    .replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)')
    .replace(/\\mathrm\s*\{([^{}]*)\}/g, '$1')
    .replace(/\\text\s*\{([^{}]*)\}/g, '$1')
    .replace(/\\sum\s*_\{?([^{}]*)\}?\s*\^\{?([^{}]*)\}?/g, '∑($1…$2)')
    .replace(/\{([^{}]*)\}/g, '$1')
    .replace(/\\left|\\right|\\displaystyle/g, '')
    .replace(/\\cdot/g, '·').replace(/\\times/g, '×').replace(/\\div/g, '÷')
    .replace(/\\leq/g, '≤').replace(/\\geq/g, '≥').replace(/\\neq/g, '≠').replace(/\\approx/g, '≈')
    .replace(/\\to/g, '→').replace(/\\infty/g, '∞').replace(/\\cdots|\\ldots|\\dots/g, '…')
    .replace(/\\pi/g, 'π').replace(/\\xi/g, 'ξ').replace(/\\theta/g, 'θ')
    .replace(/\\alpha/g, 'α').replace(/\\beta/g, 'β').replace(/\\gamma/g, 'γ').replace(/\\delta/g, 'δ')
    .replace(/\\lambda/g, 'λ').replace(/\\mu/g, 'μ').replace(/\\sigma/g, 'σ').replace(/\\omega/g, 'ω')
    .replace(/\\sum/g, '∑').replace(/\\int/g, '∫').replace(/\\partial/g, '∂')
    .replace(/\\lim/g, 'lim').replace(/\\ln/g, 'ln').replace(/\\log/g, 'log')
    .replace(/\\sin/g, 'sin').replace(/\\cos/g, 'cos').replace(/\\tan/g, 'tan')
    .replace(/\\[,;:! ]/g, ' ')
    .replace(/\^\{?([0-9n+\-])\}?/g, function(_, c){ return SUP[c] || '^' + c; })
    .replace(/_\{?([0-9nx])\}?/g, function(_, c){ return SUB[c] || '_' + c; })
    .replace(/\\[a-zA-Z]+/g, function(m){ return m.slice(1); });
  return t;
}

/* ---------- 公式里的加号修复 ---------- */
// 平台会把半角 + 当空格吞掉，公式里就少了加号。
// 只在数学定界符内部，把「数字/} /变量 后面直接跟空格再接变量或命令」的地方补回 +
function fixMathSpaces(text){
  var s = String(text || '');
  var re = /(\$[^$]+\$|\\\([\s\S]*?\\\)|\\\[[\s\S]*?\\\]|\$\$[\s\S]*?\$\$)/g;
  return s.replace(re, function(seg){ return repairSegment(seg); });
}

// 找出 prev 位置所在的 {...} 内容（若是 } 则向前配对）
function groupBefore(str, idx){
  if (str[idx] !== '}') return null;
  var depth = 0;
  for (var i = idx; i >= 0; i--) {
    if (str[i] === '}') depth++;
    else if (str[i] === '{') { depth--; if (depth === 0) return str.slice(i + 1, idx); }
  }
  return null;
}

function repairSegment(seg){
  var out = '';
  var i = 0;
  while (i < seg.length) {
    var ch = seg[i];
    // 检测一段空白
    if (/\s/.test(ch)) {
      var j = i;
      while (j < seg.length && /\s/.test(seg[j])) j++;
      var prev = out.length ? out[out.length - 1] : '';
      var next = seg.slice(j);
      var prevOperand = /[\d\)\]\}xXa-zA-Z!]/.test(prev);
      var nextOperand = /^(\d|[a-zA-Z](?![a-zA-Z])|\\frac|\\sqrt|\\sin|\\cos|\\tan|\\ln|\\log|\\sum|\\int)/.test(next);
      var skip = false;
      // 前一个字符属于 LaTeX 命令（如 \to、\sin、\lim）时不补
      if (/[a-zA-Z]/.test(prev)) {
        var m = /[a-zA-Z]+$/.exec(out);
        if (m) {
          var before = out.slice(0, out.length - m[0].length);
          if (before.slice(-1) === '\\') skip = true;
        }
      }
      if (prev === '}') {
        var g = groupBefore(out, out.length - 1);
        // 下标/极限/求和里的 } 后面不补（如 lim_{x \to 0} \frac）
        if (g && /\\to|\\lim|\\sum|\\int|_|\^/.test(g)) skip = true;
      }
      if (prevOperand && nextOperand && !skip) out += ' + ';
      else out += seg.slice(i, j);
      i = j;
      continue;
    }
    out += ch;
    i++;
  }
  return out;
}

function renderMath(root){
  if (!root) return;
  // 先补加号
  try {
    var walker0 = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var list0 = [];
    while (walker0.nextNode()) list0.push(walker0.currentNode);
    list0.forEach(function(n){
      if (n.nodeValue && /\$|\\\(|\\\[/.test(n.nodeValue)) n.nodeValue = fixMathSpaces(n.nodeValue);
    });
  } catch (e) { /* ignore */ }
  var tries = 0;
  (function attempt(){
    if (window.renderMathInElement) {
      try {
        window.renderMathInElement(root, {
          delimiters: [
            { left: '\\[', right: '\\]', display: true },
            { left: '\\(', right: '\\)', display: false },
            { left: '$$', right: '$$', display: true },
            { left: '$', right: '$', display: false }
          ],
          throwOnError: false,
          ignoredTags: ['script','noscript','style','textarea','pre','code']
        });
        return;
      } catch (e) { /* 落到降级 */ }
    }
    if (tries++ < 150) { setTimeout(attempt, 100); return; }
    if (root.getAttribute('data-fallback') === '1') return;
    root.setAttribute('data-fallback', '1');
    // 降级：把 LaTeX 转成可读纯文本
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
    var nodes = [];
    while (walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(function(n){
      var v = n.nodeValue;
      if (!v) return;
      if (v.indexOf('\\') === -1 && v.indexOf('^') === -1 && v.indexOf('_') === -1) return;
      if (!n.__orig) n.__orig = v;      // 记住原文，KaTeX 后到时可以还原
      n.nodeValue = latexToText(v);
    });
  })();
}

/* ---------- 数据加载 ---------- */
// KaTeX 加载完成后，如果页面还没渲染过公式（说明刚才走了降级或还没跑），再补一次
window.__katexReady = function(){
  var body = document.getElementById('body');
  if (!body || !window.renderMathInElement) return;
  if (body.querySelector('.katex')) return;
  // 如果之前走过降级，先把原文还原，再交给 KaTeX 渲染
  try {
    var w = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
    var ns = [];
    while (w.nextNode()) ns.push(w.currentNode);
    ns.forEach(function(n){
      if (n.__orig) { n.nodeValue = n.__orig; n.__orig = null; }
    });
  } catch (e) { /* ignore */ }
  try {
    window.renderMathInElement(body, {
      delimiters: [
        { left: '\\[', right: '\\]', display: true },
        { left: '\\(', right: '\\)', display: false },
        { left: '$$', right: '$$', display: true },
        { left: '$', right: '$', display: false }
      ],
      throwOnError: false,
      ignoredTags: ['script','noscript','style','textarea','pre','code']
    });
  } catch (e) { /* ignore */ }
};
async function loadById(id){
  // 走 RPC：只允许按 id 取单行，不能遍历整表；超时自动重试一次
  async function once(timeoutMs){
    var signal, timer = null;
    if (typeof AbortSignal !== 'undefined' && AbortSignal.timeout) {
      signal = AbortSignal.timeout(timeoutMs);
    } else if (typeof AbortController !== 'undefined') {
      var ctrl = new AbortController();
      timer = setTimeout(function(){ ctrl.abort(); }, timeoutMs);
      signal = ctrl.signal;
    }
    try {
      var r = await fetch(SB_URL + '/rest/v1/rpc/get_page', {
        method: 'POST',
        headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ p_id: id }),
        signal: signal
      });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      var rows = await r.json();
      return rows;
    } finally {
      if (timer) clearTimeout(timer);
    }
  }
  var rows = null;
  var lastErr = null;
  for (var attempt = 0; attempt < 2; attempt++) {
    try {
      rows = await once(attempt === 0 ? 15000 : 20000);
      break;
    } catch (e) {
      lastErr = e;
      if (attempt === 0) await new Promise(function(res){ setTimeout(res, 800); });
    }
  }
  if (rows === null) throw lastErr || new Error('读取失败');
  if (!rows.length) return null;
  return { title: rows[0].title || '可视化讲解', text: rows[0].body || '' };
}

(async function(){
  // 保存下来的离线 HTML 自带标记，不再请求数据库
  if (document.querySelector('meta[name="wg-frozen"]')) return;
  var id = getParam('id');
  if (id) {
    try {
      var p = await loadById(id);
      if (p) { render(p); return; }
      render({ title:'页面不存在', text:'没找到这个页面，链接可能被写错了。回对话里发一句「再来 2 道不一样的题，并做成可点击页面，把新链接发给我」，或点题目页面右下角的「再来几题」，就会重新生成。' });
      return;
    } catch (e) {
      var msg = '网络有点慢，没取到内容。点下面的「重新加载」再试一次；还不行就回对话里让它重新生成。';
      render({ title:'加载失败', text: msg });
      return;
    }
  }
  var d = getParam('d');
  var payload = d ? decodePack(d) : null;
  if (!payload) {
    var t = getParam('t');
    if (t) payload = { title: getParam('title') || '可视化讲解', text: t };
  }
  if (!payload) payload = { title:'可视化讲解', text:'没有收到内容。链接里需要有 d= 或 t= 参数。' };
  render(payload);
})();

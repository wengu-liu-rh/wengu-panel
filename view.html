<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>温故 · 可视化讲解</title>
<style>
:root{
  --ink:#1f2d3a; --ink2:#5b6b7a; --line:#e8e2d6;
  --teal:#0f766e; --teal-l:#ccfbf1; --orange:#ea7c1f; --orange-l:#ffedd5;
  --violet:#6d5bd0; --violet-l:#ece9ff; --rose:#d9446b; --rose-l:#ffe4ec;
  --green:#15803d; --green-l:#dcfce7; --red:#b91c1c; --red-l:#fee2e2;
}
*{box-sizing:border-box}
body{
  margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--ink);background:#faf7f0;
  background-image:
    radial-gradient(circle at 12% 8%, rgba(247,165,74,.16), transparent 42%),
    radial-gradient(circle at 88% 12%, rgba(15,118,110,.14), transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(109,91,208,.10), transparent 45%);
  min-height:100vh;padding:26px 14px 64px;
}
.wrap{max-width:820px;margin:0 auto}
/* 顶部 */
.hero{
  background:linear-gradient(135deg,#0f766e 0%,#12877d 55%,#0e9f8e 100%);
  border-radius:22px;padding:22px 22px 20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 14px 36px rgba(15,118,110,.28);margin-bottom:18px;
}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.24),transparent 65%)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.5px;
  background:rgba(255,255,255,.18);padding:5px 10px;border-radius:999px;margin-bottom:10px}
.hero h1{margin:0;font-size:27px;line-height:1.3;font-weight:700}
.hero p{margin:8px 0 0;font-size:13.5px;opacity:.9;line-height:1.6}
/* 卡片 */
.grid{display:grid;gap:14px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 8px 26px rgba(90,110,130,.10);
  border:1px solid #f1ece1;animation:rise .45s ease both}
.card h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.badge{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;color:#fff;flex:none}
.b1{background:var(--teal)} .b2{background:var(--orange)} .b3{background:var(--violet)} .b4{background:var(--rose)}
p.para{margin:7px 0;line-height:1.85;font-size:15px;color:var(--ink)}
ul.kv{margin:8px 0 0;padding-left:0;list-style:none}
ul.kv li{display:flex;gap:9px;align-items:flex-start;margin:9px 0;font-size:15px;line-height:1.7}
ul.kv li .dotc{width:20px;height:20px;border-radius:50%;flex:none;margin-top:2px;
  display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;font-weight:700}
/* 流程 */
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}
.step{flex:1;min-width:120px;background:linear-gradient(180deg,#ffffff,#f6fbfa);
  border:1px solid #d9ede9;border-radius:14px;padding:12px}
.step .n{font-size:11px;color:var(--teal);font-weight:700;letter-spacing:.4px}
.step .t{font-size:14.5px;margin-top:4px;line-height:1.5}
.arrow{color:#b9cdc9;font-size:18px;font-weight:700}
/* 折叠 */
details{background:#fbfaf6;border:1px solid #efe9dc;border-radius:12px;padding:10px 12px;margin:10px 0}
details summary{cursor:pointer;font-size:14px;color:var(--teal);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary:before{content:"▸ ";color:var(--orange)}
details[open] summary:before{content:"▾ "}
details p{margin:8px 0 0;font-size:14px;line-height:1.8;color:var(--ink2)}
/* 选项 */
.opt{display:flex;gap:10px;align-items:center;width:100%;text-align:left;margin:9px 0;padding:13px 15px;
  border-radius:13px;border:1.5px solid #e6e0d4;background:#fffdf8;font-size:15px;cursor:pointer;
  font-family:inherit;color:var(--ink);transition:.16s;position:relative}
.opt .k{width:26px;height:26px;border-radius:8px;background:#f3efe6;color:#8a7a5f;font-weight:700;font-size:13px;
  display:flex;align-items:center;justify-content:center;flex:none;transition:.16s}
.opt:hover{border-color:var(--orange);background:#fff8ee;transform:translateX(2px)}
.opt.on{border-color:var(--teal);background:var(--teal-l);box-shadow:0 0 0 3px rgba(15,118,110,.12)}
.opt.on .k{background:var(--teal);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-l);box-shadow:0 0 0 3px rgba(21,128,61,.12)}
.opt.right .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-l);box-shadow:0 0 0 3px rgba(185,28,28,.10)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt .mark{margin-left:auto;font-size:13px;font-weight:700;opacity:0;transition:.2s}
.opt.right .mark,.opt.wrong .mark{opacity:1}
/* 进度 */
.prog{height:8px;border-radius:99px;background:#eef3f1;overflow:hidden;margin:12px 0 4px}
.prog i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#0f766e,#22b8a6,#f7a54a);transition:width .35s ease}
.prog-txt{font-size:12px;color:#8a9aa7;text-align:right}
/* 底部 */
.foot{margin-top:22px;text-align:center;font-size:12px;color:#a9b4bd;line-height:1.8}
.actions{display:flex;gap:10px;margin-top:16px}
.actions button{flex:1;padding:12px;border-radius:13px;border:none;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:600;transition:.16s}
.act-main{background:linear-gradient(135deg,#0f766e,#0e9f8e);color:#fff;box-shadow:0 8px 20px rgba(15,118,110,.25)}
.act-main:hover{transform:translateY(-1px)}
.act-ghost{background:#fff;color:var(--teal);border:1.5px solid #cfe7e3}
.act-ghost:hover{background:#f2fbfa}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (max-width:520px){.hero h1{font-size:23px}.flow{flex-direction:column;align-items:stretch}.arrow{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="tag">🌊 温故 · 可视化讲解</div>
    <h1 id="title">加载中…</h1>
    <p id="sub">点一点、折一折，把知识点看明白</p>
  </div>
  <div id="body" class="grid"></div>
  <div class="actions">
    <button class="act-main" onclick="downloadHtml()">保存为 HTML</button>
    <button class="act-ghost" onclick="location.reload()">重新加载</button>
  </div>
  <div class="foot">由「温故」生成 · 吉林工商学院 AI 智能体大赛</div>
</div>
<script>
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getParam(n){
  var m = new RegExp('[?&]'+n+'=([^&]*)').exec(location.search);
  return m ? decodeURIComponent(m[1].replace(/\+/g,' ')) : '';
}
function decodePack(d){
  if(!d) return null;
  var s = d.replace(/-/g,'+').replace(/_/g,'/');
  while(s.length%4) s+='=';
  try{
    var bin = atob(s), bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    return JSON.parse(new TextDecoder('utf-8').decode(bytes));
  }catch(e){ return null; }
}
var COLORS=[['b1','var(--teal)'],['b2','var(--orange)'],['b3','var(--violet)'],['b4','var(--rose)']];
var ICONS=['①','②','③','④','⑤','⑥'];

function detect(lines){
  var secs=[], cur=null;
  lines.forEach(function(line){
    var m = line.match(/^(【(.+?)】|([一二三四五六七八九十]+、.{1,20})|(.{1,14})[:：])\s*$/);
    var head = null;
    if (m) head = m[2] || m[3] || m[4];
    else if (/^#\s+/.test(line)) head = line.replace(/^#\s+/,'');
    if (head){ cur={title:head, items:[]}; secs.push(cur); }
    else { if(!cur){ cur={title:'要点', items:[]}; secs.push(cur);} cur.items.push(line); }
  });
  return secs;
}

function renderItems(items, secIndex){
  var html='', opts=[], stepNum=0;
  // 选项成组
  items.forEach(function(line){
    var opt = line.match(/^([A-DＡ-Ｄ])[\.、\s]\s*(.+)$/);
    var qm  = line.match(/^(\d+)[\.、]\s*(.+)$/);
    if(opt){ opts.push({k:opt[1], t:opt[2]}); }
    else if(qm){ stepNum++; html += '<div class="step"><div class="n">STEP '+qm[1]+'</div><div class="t">'+esc(qm[2])+'</div></div>'; }
    else if(/^[-·•]\s*/.test(line)){ html += '<ul class="kv"><li><span class="dotc" style="background:var(--orange)">•</span><span>'+esc(line.replace(/^[-·•]\s*/,''))+'</span></li></ul>'; }
    else { html += '<p class="para">'+esc(line)+'</p>'; }
  });
  if (stepNum>1){
    html = '<div class="flow">'+html.replace(/<\/div><div class="step">/g,'</div><span class="arrow">→</span><div class="step">')+'</div>';
  }
  if (opts.length){
    html += '<div style="margin-top:14px;font-size:13px;color:#8a9aa7">点一下你认为正确的选项</div>';
    opts.forEach(function(o){
      html += '<button class="opt" data-k="'+esc(o.k)+'" onclick="pick(this)"><span class="k">'+esc(o.k)+'</span><span>'+esc(o.t)+'</span><span class="mark">✓</span></button>';
    });
  }
  return html;
}

function render(payload){
  var title = payload.title || '可视化讲解';
  var text = payload.text || '';
  document.getElementById('title').textContent = title;
  document.title = title;
  var t0 = String(text)
    .replace(/\r/g, '')
    .replace(/#{2,6}\s*/g, '\n')
    .replace(/#\s+/g, '\n')
    .replace(/\*\*(.+?)\*\*/g, '$1')
    .replace(/^\s*[-*•]\s+/gm, '- ');
  var lines = t0.split(/\n+/).map(function(s){return s.trim();}).filter(Boolean);
  if(!lines.length){ document.getElementById('body').innerHTML = '<div class="card"><p class="para">没有收到内容。</p></div>'; return; }
  var secs = detect(lines);
  var html='';
  secs = secs.filter(function(s){ return s.items.length > 0; });
  secs.forEach(function(sec,i){
    var c = COLORS[i%COLORS.length];
    var badge = ICONS[i] || String(i+1);
    html += '<div class="card" style="animation-delay:'+(i*0.05)+'s">'
         +  '<h3><span class="badge '+c[0]+'">'+badge+'</span>'+esc(sec.title)+'</h3>'
         +  renderItems(sec.items, i)
         +  '</div>';
  });
  document.getElementById('body').innerHTML = html;
}

function pick(el){
  var all = document.querySelectorAll('.opt');
  Array.prototype.forEach.call(all, function(b){ b.classList.remove('on','right','wrong'); });
  el.classList.add('on');
  var mk = el.querySelector('.mark');
  if(mk) mk.textContent = '✓';
}

function downloadHtml(){
  var html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
  var blob = new Blob([html], {type:'text/html;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (document.title || '温故讲解') + '.html';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
}

var SB_URL = 'https://stefvsokishbdowhushy.supabase.co';
var SB_KEY = 'sb_publishable_oeWZ9eyPqcBvO28W3wUJFQ_IdWSQBBi';

async function loadById(id){
  var url = SB_URL + '/rest/v1/pages?id=eq.' + encodeURIComponent(id) + '&select=id,title,body';
  var r = await fetch(url, { headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY } });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  var rows = await r.json();
  if(!rows || !rows.length) return null;
  return { title: rows[0].title || '可视化讲解', text: rows[0].body || '' };
}

(async function(){
  var id = getParam('id');
  if(id){
    document.getElementById('title').textContent = '加载中…';
    try {
      var p = await loadById(id);
      if(p){ render(p); return; }
      render({ title:'页面不存在', text:'这个链接已失效，请重新生成。' });
      return;
    } catch(e){
      render({ title:'加载失败', text:'读取失败：' + e.message });
      return;
    }
  }
  var d = getParam('d');
  var payload = d ? decodePack(d) : null;
  if(!payload){
    var t = getParam('t');
    if(t) payload = { title: getParam('title') || '可视化讲解', text: t };
  }
  if(!payload) payload = { title:'可视化讲解', text:'没有收到内容。链接里需要有 d= 或 t= 参数。'};
  render(payload);
})();
</script>
</body>
</html>
